<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  const path = window.location.pathname.replace(/\/$/, '');
  if (path === '/drummachines') {
    window.location.replace('/#drummachines');
  }
</script>
  <link href="https://fonts.cdnfonts.com/css/silkscreen" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <title>Contact | MartinDrum</title>

  <style>
/* ===========================
   1. Base Styles & Resets
   =========================== */
* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  background: #111;
  scroll-padding-top: 80px; /* ensure fragment jumps account for sticky header */
}

/* ensure anchored headings are not hidden behind the sticky header */
h1[id], h2[id], .left-content h1 {
  scroll-margin-top: 80px;
}

@media (max-width: 400px) {
  h1[id], h2[id], .left-content h1 {
    scroll-margin-top: 110px; /* larger offset when header is taller on small screens */
  }
}

body {
  font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f8f8f8;
  color: #222;
  text-align: justify;
}

/* ===========================
   2. Footer
   =========================== */
footer {
  margin-top: 60px;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 0.9em;
}

/* ===========================
   3. Header & Navigation
   =========================== */
header {
  background: #111;
  color: white;
  padding: 20px 0 10px;
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0;
  width: 100%;
}

header h1 {
  margin: 0;
  text-transform: lowercase;
  line-height: 1;
  font-family: 'Silkscreen', monospace;
}

.desktop-nav {
  display: flex;
  justify-content: center;
  margin-top: 5px;
}

.desktop-nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
  font-weight: bold;
  font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

header h1 a { color: inherit; text-decoration: none; display: inline-block; }

/* Mobile menu */
.mobile-menu-icon {
  display: none;
  font-size: 1.1em;
  background: #222;
  color: white;
  padding: 8px 12px;
  border-radius: 5px;
  margin-top: 5px;
  cursor: pointer;
}

.mobile-nav-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.95);
  z-index: 2000;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.mobile-nav-overlay a {
  font-size: 1.5em;
  color: white;
  text-decoration: none;
  margin: 15px 0;
  font-weight: bold;
}

@media (max-width: 400px) {
  .desktop-nav { display: none; }
  .mobile-menu-icon { display: block; }
  html { scroll-padding-top: 110px; }
}

/* ===========================
   4. Main Content
   =========================== */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 20px; /* reduce top padding so Contact aligns like index */
}


h1, h2 {
  font-family: 'Silkscreen', monospace;
  text-align: left;
  margin: 5px 0;     /* smaller vertical margin */
  padding: 0px 0;    /* smaller vertical padding */
}


.intro, .left-content p {
  text-align: left;
  max-width: 1100px;
  margin: 0 auto 20px;
  padding: 0 20px;
  font-size: 1.05em;
}

/* Make Contact heading align with other section headings */
.left-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}
.left-content h1 {
  margin: -8px 0 0 0; /* nudge heading slightly higher */
  padding: 0; /* remove extra top and left padding so heading sits more left */
}

/* ===========================
   5. Contact Form
   =========================== */
.contact-form {
  background-color: #111;
  color: white;
  padding: 40px 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  max-width: 700px;
  margin: 20px auto;
  transition: opacity 0.6s ease;
}

.contact-form label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 20px;
  border-radius: 5px;
  border: none;
  font-size: 1em;
  box-sizing: border-box;
}

.contact-form textarea {
  resize: vertical;
  min-height: 120px;
}

.contact-form button {
  background-color: #DAFEE0;
  color: #111;
  border: none;
  padding: 12px 25px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1em;
  transition: background 0.3s ease;
}

.contact-form button:hover {
  background-color: #b0e0c1;
}

.thank-you {
  display: none;
  text-align: center;
  font-size: 1.2em;
  color: #111;
  margin-top: 20px;
}

/* ===========================
   6. Footer
   =========================== */
footer {
  margin-top: 60px;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 0.9em;
}

/* ===========================
   7. Responsive Adjustments
   =========================== */
@media (max-width: 671px) {
  main { padding: 20px 10px; }
  .contact-form { padding: 20px 10px; }
}
  </style>
</head>

<body id="top">
  <header>
    <h1><a href="index.html#top">martindrum</a></h1>

    <nav class="desktop-nav">
      <a href="index.html#about">about</a>
      <a href="index.html#music">music</a>
      <a href="index.html#performances">performances</a>
      <a href="index.html#creations">creations</a>
      <a href="software.html">software</a>
      <a href="contact.html">contact</a>
    </nav>

    <div class="mobile-menu-icon" onclick="toggleMobileMenu()">Menu</div>

    <div class="mobile-nav-overlay" id="mobileNav">
      <a href="index.html#about" onclick="closeMobileMenu()">about</a>
      <a href="index.html#music" onclick="closeMobileMenu()">music</a>
      <a href="index.html#performances" onclick="closeMobileMenu()">performances</a>
      <a href="index.html#creations" onclick="closeMobileMenu()">creations</a>
      <a href="software.html" onclick="closeMobileMenu()">software</a>
      <a href="contact.html" onclick="closeMobileMenu()">contact</a>
    </div>
  </header>

<main>
  <div class="left-content">
    <h1>Contact</h1>
    <p>Feel free to reach out for collaborations, inquiries, or messages.</p>
  </div>

  <form class="contact-form" id="contactForm" action="https://formspree.io/f/maqwyewy" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your Name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Your message here..." required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <div class="thank-you" id="thankYouMsg">
    Form submitted, thanks! :)
  </div>
</main>

<footer>
  <p>&copy; 2026 MartinDrum</p>
</footer>

<script>
function toggleMobileMenu() {
  const mobileNav = document.getElementById('mobileNav');
  mobileNav.style.display = mobileNav.style.display === 'flex' ? 'none' : 'flex';
}

function closeMobileMenu() {
  document.getElementById('mobileNav').style.display = 'none';
}

const form = document.getElementById('contactForm');
const thankYou = document.getElementById('thankYouMsg');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(form);

  fetch(form.action, {
    method: 'POST',
    body: formData,
    headers: { 'Accept': 'application/json' }
  }).then(response => {
    if (response.ok) {
      form.style.opacity = '0';
      setTimeout(() => {
        form.style.display = 'none';
        thankYou.style.display = 'block';
      }, 600);
    } else {
      alert('Oops! There was a problem submitting your form.');
    }
  }).catch(error => {
    alert('Oops! There was a problem submitting your form.');
    console.error(error);
  });
});
</script>

</body>
</html>
